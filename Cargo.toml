[package]
name = "aiprog"
version = "0.0.2-WIP"
edition = "2024"
description = "Rust engine for moving from AI tool calls to AI program execution"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/zcoder-run/aiprog"
repository = "https://github.com/zcoder-run/aiprog"
categories = [
  "development-tools",
  "api-bindings"
]
keywords = [
  "ai",
  "lua",
  "mcp",
  "llm",
  "agent"
]


[lib]
doctest = false

[lints.rust]
unsafe_code = "forbid"
unused = { level = "allow", priority = -1 } # For exploratory dev.

[dependencies]
# -- Async
tokio = { version = "1", features = ["full"] }
# -- Json & Data Formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["macros"] }
jsonc-parser = { version = "0.32", features = ["serde"]}
value-ext = "0.1.2"
toml = "1"
serde_yaml_ng = "0.10"
csv = "1"
lopdf = "0.40"
# -- AI
genai = { version = "0.6.0" }
udiffx = { version = "0.1.43", features = ["prompt"]}
aicost = { version = "0.1.3"}
# -- Lua
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
# -- String pasers, matchers, ormatters
logos = "0.16"
aho-corasick = "1.1.3"
lazy-regex = "3.4.1"
regex = "1"
num-format = "0.4.4"
humantime = "2.3.0"
textwrap = "0.16"
markex = { version = "0.1.0" }
# -- Hash
blake3 = "1.8.2"
sha2 = "0.11"
# -- BaseX
base64 = "0.22.1"
bs58 = "0.5.1"
hex = "0.4" # Added for hex encoding
# -- Files
simple-fs = { version = "0.12.1", features = ["with-json"]}
size = "0.5.0"
# -- HTML & XML
html-escape = "0.2"
html-helpers = { version = "0.1.0" }
htmd = "0.5"
url = "2.5.7"
quick-xml = "0.40"
# -- Error
derive_more = { version = "2", features = ["display", "from"] }
time = { version = "0.3.44", features = ["formatting", "local-offset"]}
time-tz = {version = "2.0.0", features = ["system"]}
schemars = "1.2.1"


[dev-dependencies]
assertables = "9"

